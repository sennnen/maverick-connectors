[package]
name = "mav-connector-whoop5"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mav-connector-sdk = "=0.1.1"
whoop-protocol = { path = "../../crates/whoop-protocol" }

[lints]
workspace = true

[features]
# The ECG discovery build. Off by default and never in a release artifact: it sends the
# `enable_raw_data_w_ecg` config flag and START_RAW_DATA, then reports every frame it cannot decode
# as hex so the bytes can be read. A Cargo feature rather than a runtime toggle, so a probe build
# is a different artifact and cannot be shipped by mistake.
ecg-probe = []
