[package]
name = "mav-connector-whoop4"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ble-sig = { path = "../../crates/ble-sig" }
mav-connector-sdk = "=0.1.1"
whoop-protocol = { path = "../../crates/whoop-protocol" }

[features]
# The raw-AFE discovery build. Off by default and never in a release artifact: it starts the type-43
# stream (opcode 63) and emits the raw optical channels. A Cargo feature rather than a runtime
# toggle, so a probe build is a different artifact and cannot be shipped by mistake.
raw-probe = []

[lints]
workspace = true
